<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0308" />
  <meta name="description" content="A beating rose for Agnes Charity, by Bob Sebastian." />
  <title>For Agnes Charity &#10084;</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Three stacked canvases: atmosphere behind, bloom, glow on top -->
  <canvas id="bgCanvas"   class="layer" aria-hidden="true"></canvas>
  <canvas id="roseCanvas" class="layer" aria-hidden="true"></canvas>
  <canvas id="glowCanvas" class="layer glow" aria-hidden="true"></canvas>

  <!-- Title -->
  <div class="title">
    <p class="k" id="titleKicker">Happy Birthday</p>
    <h1 class="n" id="titleName">Agnes Charity</h1>
  </div>

  <!-- Photo frame (your pictures cross-fade here). Two <img> for smooth fades. -->
  <div class="photo-frame" id="photoFrame" aria-hidden="true">
    <img id="photoA" class="photo" alt="" />
    <img id="photoB" class="photo" alt="" />
    <div class="frame-glow" aria-hidden="true"></div>
  </div>

  <!-- The letter (built from CONFIG by JS) -->
  <div class="letter" id="letter"></div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <button class="icon-btn" id="replayBtn" type="button" aria-label="Replay" title="Replay">
      <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.4 4.2H8V7H2v6h2.2v-2A9 9 0 1 0 12 3v2z"/></svg>
    </button>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound" title="Sound">
      <svg class="s-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8z"/></svg>
      <svg class="s-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
    </button>
  </div>

  <!-- One-time gentle "tap for sound" (auto-hides) -->
  <button id="tapStart" class="tap-start" type="button">
    <span class="tap-inner"><span class="tap-heart">&#10084;</span><span class="tap-text">tap for sound</span></span>
  </button>

  <noscript>Please enable JavaScript to see the surprise.</noscript>

  <script src="./js/config.js" defer></script>
  <script src="./js/utils.js" defer></script>
  <script src="./js/audio.js" defer></script>
  <script src="./js/atmosphere.js" defer></script>
  <script src="./js/bloom.js" defer></script>
  <script src="./js/gallery.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>

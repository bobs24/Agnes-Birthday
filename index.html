<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0410" />
  <meta name="description" content="A cinematic birthday surprise for Agnes Charity, by Bob Sebastian." />
  <title>For Agnes Charity &#10084;</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- ===== Three stacked canvases build the cinematic depth ===== -->
  <canvas id="bgCanvas"   class="layer" aria-hidden="true"></canvas>  <!-- stars + bokeh -->
  <canvas id="mainCanvas" class="layer" aria-hidden="true"></canvas>  <!-- roses + particle text + fireworks -->
  <canvas id="glowCanvas" class="layer glow" aria-hidden="true"></canvas> <!-- bloom / glow -->

  <!-- Static ambience (CSS-only): aurora, vignette, film grain -->
  <div class="aurora aurora-1" aria-hidden="true"></div>
  <div class="aurora aurora-2" aria-hidden="true"></div>
  <div class="aurora aurora-3" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ===== DOM text overlays (crisp typography above the canvases) ===== -->
  <div class="overlay">
    <p id="kicker" class="kicker"></p>

    <!-- Gold underline that draws itself under the name -->
    <div id="goldRule" class="gold-rule" aria-hidden="true"></div>

    <!-- Giant gradient age number -->
    <div id="ageNumber" class="age-number" aria-hidden="true"></div>
    <p id="ageSub" class="age-sub"></p>

    <!-- Birthday quote -->
    <blockquote id="quoteLine" class="quote"></blockquote>

    <!-- Signature block -->
    <p id="signature" class="sign-from"></p>
    <p id="signName" class="sign-name"></p>
    <div id="heartMark" class="heart">&#10084;</div>
  </div>

  <!-- ===== Controls (revealed after the clean 15s) ===== -->
  <div id="controls" class="controls">
    <button id="replayBtn" class="icon-btn" type="button" aria-label="Replay" title="Replay">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.4 4.2H8V7H2v6h2.2v-2A9 9 0 1 0 12 3v2z"/></svg>
    </button>
    <button id="soundBtn" class="icon-btn" type="button" aria-label="Sound" title="Sound">
      <svg class="s-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8z"/></svg>
      <svg class="s-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1z"/></svg>
    </button>
  </div>

  <!-- ===== One-time gentle prompt so audio can begin (auto-hides) ===== -->
  <button id="tapStart" class="tap-start" type="button">
    <span class="tap-inner">
      <span class="tap-heart">&#10084;</span>
      <span class="tap-text">tap for sound</span>
    </span>
  </button>

  <noscript>Please enable JavaScript to experience the surprise.</noscript>

  <!-- Scripts load in dependency order (no bundler needed for GitHub Pages). -->
  <script src="./js/config.js" defer></script>
  <script src="./js/utils.js" defer></script>
  <script src="./js/audio.js" defer></script>
  <script src="./js/particles.js" defer></script>
  <script src="./js/particleText.js" defer></script>
  <script src="./js/roses.js" defer></script>
  <script src="./js/fireworks.js" defer></script>
  <script src="./js/sequencer.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
